name: Testes e executável Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versão para publicar, por exemplo v0.1.0 (deixe vazio para apenas gerar o executável)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  tests:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q main.py renamer.py tests
      - name: Executar testes
        run: python -m unittest discover -s tests -v

  build-windows:
    name: Compilar aplicativo portátil
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências e empacotador
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Gerar executável com dicionários ortográficos
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all spellchecker --name RenomeadorPortable main.py
      - name: Preparar pacote ZIP
        shell: pwsh
        run: |
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\RenomeadorPortable.exe,dist\README.md -DestinationPath dist\RenomeadorPortable.zip -Force
      - name: Disponibilizar downloads
        uses: actions/upload-artifact@v7
        with:
          name: RenomeadorPortable-Windows
          path: |
            dist/RenomeadorPortable.exe
            dist/RenomeadorPortable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release ao enviar uma tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist\RenomeadorPortable.exe dist\RenomeadorPortable.zip --title "$env:GITHUB_REF_NAME" --generate-notes
      - name: Publicar Release a partir de execução manual
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Informe a versão no formato vMAJOR.MINOR.PATCH, por exemplo v0.1.0."
          }
          gh release create "$env:RELEASE_VERSION" dist\RenomeadorPortable.exe dist\RenomeadorPortable.zip --target main --title "$env:RELEASE_VERSION" --generate-notes
